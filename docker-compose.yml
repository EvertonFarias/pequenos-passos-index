services:
  web:
    image: nginx:alpine
    container_name: pequenos-passos
    restart: unless-stopped
    networks:
      - caddy-net
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./PequenosPassos.apk:/usr/share/nginx/html/PequenosPassos.apk:ro
      - ./PequenosPassos/assets/images:/usr/share/nginx/html/PequenosPassos/assets/images:ro

networks:
  caddy-net:
    external: true
    name: pequenospassos-backend_default
