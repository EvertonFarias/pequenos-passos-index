server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MIME type correto para APK — obrigatório para Android aceitar o download
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/svg+xml                         svg;
        image/x-icon                          ico;
        application/vnd.android.package-archive apk;
    }

    # Força download do APK em vez de abrir no browser
    location ~* \.apk$ {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache para assets estáticos
    location ~* \.(png|jpg|jpeg|svg|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
