server {
    listen 80;
    server_name pequenos-passos.evertonapps.space;

    # Necessário para o certbot emitir o certificado
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona tudo para HTTPS (ativa depois de ter o certificado)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html                                html htm;
        text/css                                 css;
        application/javascript                   js;
        image/png                                png;
        image/jpeg                               jpg jpeg;
        image/svg+xml                            svg;
        image/x-icon                             ico;
        application/vnd.android.package-archive  apk;
    }

    location ~* \.apk$ {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
